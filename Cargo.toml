[package]
name = "framboid"
version = "0.6.0"
edition = "2024"
description = "Rust implementation of the Varve standard"
license = "AGPL-3.0-only"
repository = "https://github.com/ZA1815/framboid"

[dependencies]
bitcode = { version = "0.6.9", features = ["serde"] }
blake3 = { version = "1.8.7", features = ["serde"] }
indexmap = { version = "2.14.2", features = ["serde"] }
interprocess = "2.4.4"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["serde"] }
url = "2.5.8"
